name: Cloud sync tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cloud-core.js
      - run: node --check cloud-sync.js
      - run: node --check faith.js
      - run: node --test tests/*.test.cjs
